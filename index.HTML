  .confirm p{color:var(--charcoal); font-size:0.9rem; line-height: 1.4; margin-bottom: 0;}

    border: 1px solid var(--line);

  .login-box h2{font-family:'Inter',sans-serif; font-weight:600; margin-bottom:4px; color: var(--ink); text-transform: uppercase;}
  .login-box p{color:var(--charcoal); font-size:0.82rem; margin-top:0;}
  .error-msg{color:var(--warn); font-size:0.8rem; margin-top:8px; min-height:1.2em;}

  .admin-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .admin-top h1{font-family:'Inter',sans-serif; font-weight:600; font-size:1.3rem; margin:0; color: var(--ink); text-transform: uppercase;}
  .day-group{margin-top:16px;}
  .booking-item{

  .booking-main .meta{font-size:0.78rem; color:var(--charcoal); margin-top:2px;}
  .booking-actions{display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;}
  .icon-btn{
    border:1px solid var(--line); background:var(--bone); border-radius:7px;
    padding:6px 8px; font-size:0.75rem; cursor:pointer; color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .icon-btn.warn{color:var(--warn); border-color:var(--warn);}
  .empty-state{
    text-align:center; padding:30px 10px; color:var(--charcoal); font-size:0.88rem;
  }
  .loading{text-align:center; padding:30px; color:var(--charcoal); font-size:0.85rem;}
</style>

function getRawPhoneDigits(v) {
  let r = v.replace(/\D/g, '');
  if (r.length === 11 && !r.startsWith('0')) {
    r = '0' + r;
  }
  if (r.length > 12) {
    r = r.slice(0, 12);
  }
  return r;
}

function formatPhone(v) {
  let r = getRawPhoneDigits(v);
  if (r.length >= 3 && r.startsWith('0')) {
    let ddd = r.slice(1, 3);
    let resto = r.slice(3);
    if (resto.length <= 5) {
      return `(0${ddd}) ${resto}`;
    } else {
      return `(0${ddd}) ${resto.slice(0, 5)}-${resto.slice(5, 9)}`;
    }
  } else if (r.length > 0) {
    if (r.length <= 2) return `(${r}`;
    if (r.length <= 7) return `(${r.slice(0,2)}) ${r.slice(2)}`;
    return `(${r.slice(0,2)}) ${r.slice(2,7)}-${r.slice(7,11)}`;
  }
  return r;
}

function isPhoneValid(tel) {
  const digits = getRawPhoneDigits(tel);
  return digits.length === 12 && digits.startsWith('0');
}

function getNext7Days(){
  const days = [];
  const weekDays = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const now = new Date();
  for(let i = 0; i < 7; i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    let label = i === 0 ? 'hoje' : (i === 1 ? 'amanhã' : weekDays[d.getDay()]);
    const num = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
    days.push({ iso, label, num });
  }
  return days;
}

function getMonthSlots(monthKey){
  const list = state.horariosPorMes[monthKey];
  return list ? [...list].sort() : [...DEFAULT_SLOT_TIMES];
}
function getSlotsForDate(dateStr){
  return getMonthSlots(dateStr.slice(0,7));
}
async function setMonthSlots(monthKey, arr){
  const clean = [...new Set(arr)].filter(Boolean).sort();
  state.horariosPorMes[monthKey] = clean;
  await saveHorarios();
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    state.bookings = res && res.value ? res.value : [];
  }catch(e){
    console.error('Erro ao carregar agendamentos:', e);
    state.bookings = [];
  }
  try{
    const resFin = await window.storage.get(FINANCIAL_KEY);
    state.financials = resFin && resFin.value ? resFin.value : [];
  }catch(e){
    console.error('Erro ao carregar financeiro:', e);
    state.financials = [];
  }
  try{
    const res2 = await window.storage.get(HORARIOS_KEY);
    if(res2 && res2.value){
      state.horariosPorMes = res2.value;
    }
  }catch(e){
    console.error('Erro ao carregar horários por mês:', e);
  }
  state.loading = false;
}

async function saveBookings(){
  try{
    await window.storage.set(STORAGE_KEY, state.bookings);
  }catch(e){
    console.error('Erro ao salvar agendamentos:', e);
  }
}

async function saveFinancials(){
  try{
    await window.storage.set(FINANCIAL_KEY, state.financials);
  }catch(e){
    console.error('Erro ao salvar financeiro:', e);
  }
}

async function saveHorarios(){
  try{
    await window.storage.set(HORARIOS_KEY, state.horariosPorMes);
  }catch(e){
    console.error('Erro ao salvar horários:', e);
  }
}

function render(){
  const app = document.getElementById('app');
  if(state.loading && state.view === 'home'){
    app.innerHTML = `<div class="loading" style="color:var(--ink);">Carregando…</div>`;
    return;
  }
  if(state.view === 'home') return renderHome(app);
  if(state.view === 'public') return renderPublic(app);
  if(state.view === 'login') return renderLogin(app);
  if(state.view === 'admin') return renderAdmin(app);
  if(state.view === 'config') return renderConfig(app);
  if(state.view === 'financeiro') return renderFinanceiro(app);
}

        state.selectedTime = '';
        render();
      });
    }

    document.querySelectorAll('.slot:not(.taken):not(.past)').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.selectedTime = el.dataset.time;
        render();
      });
    });
    const form = document.getElementById('booking-form');
    if(form) form.addEventListener('submit', handleSubmit);
    
    const nomeInput = document.getElementById('nome-input');
    if(nomeInput) {
      nomeInput.addEventListener('input', (e)=>{ 
        e.target.value = e.target.value.toUpperCase();
        state.nome = e.target.value; 
      });
    }
    
    const telInput = document.getElementById('tel-input');
    if(telInput) {
      telInput.addEventListener('input', (e)=>{
        state.telTouched = true;
        const formatted = formatPhone(e.target.value);
        e.target.value = formatted;
        state.telefone = formatted;
        
        const valid = isPhoneValid(state.telefone);
        const errText = document.getElementById('tel-error-text');
        const submitBtn = document.getElementById('submit-btn');
        
        if (!valid) {
          telInput.classList.add('has-error');
          if(errText) errText.classList.add('show');
        } else {
          telInput.classList.remove('has-error');
          if(errText) errText.classList.remove('show');
        }

        if(submitBtn) {
          const hasServices = state.selectedServices.length > 0;
          submitBtn.disabled = !hasServices || !state.selectedDate || !state.selectedTime || !state.nome.trim() || !valid;
        }
      });

      telInput.addEventListener('blur', ()=>{
        state.telTouched = true;
        render();
      });
    }
  }
}

function serviceName(servicoStr) {
  if (!servicoStr) return '';
  return servicoStr.split(',').map(id => {
    const found = SERVICES.find(s => s.id === id.trim());
    return found ? found.nome : id;
  }).join(', ');
}

function formatDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function handleSubmit(e){
  e.preventDefault();
  state.telTouched = true;

  const nome = document.getElementById('nome-input')?.value.trim().toUpperCase();
  const rawInput = document.getElementById('tel-input')?.value || '';
  const digits = getRawPhoneDigits(rawInput);

  if(!nome || !isPhoneValid(digits) || state.selectedServices.length === 0 || !state.selectedDate || !state.selectedTime) {
    render();
    return;
  }

  const booking = {
    id: 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    nome, 
    telefone: formatPhone(digits),
    servico: state.selectedServices.join(','),
    data: state.selectedDate,
    hora: state.selectedTime,
    status: 'pendente',
    criadoEm: new Date().toISOString(),
  };

  const btn = e.target.querySelector('button[type=submit]');
  if(btn){
    btn.disabled = true;
    btn.textContent = 'Processando…';
  }

  state.bookings.push(booking);
  await saveBookings();

  state.lastBooking = booking;
  state.confirmed = true;
  render();
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function shiftDate(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function weekdayLabel(iso){
  const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const d = new Date(iso + 'T00:00:00');
  return dias[d.getDay()];
}

function isBookingPast(b) {
  if (!b.data || !b.hora) return false;
  const bookingDateTime = new Date(b.data + 'T' + b.hora + ':00');
  return new Date() >= bookingDateTime;
}

function formatMonthName(yyyy_mm) {
  if (!yyyy_mm) return '';
  const [y, m] = yyyy_mm.split('-');
  const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  const monthName = meses[parseInt(m, 10) - 1] || m;
  return `${monthName}/${y}`;
}

        bookingId: b.id,
        cliente: b.nome,
        servico: serviceName(b.servico),
        valor,
        formaPagamento,
        observacao,
        data: b.data,
        criadoEm: new Date().toISOString()
      };

      state.financials.push(finRecord);
      await saveFinancials();

      b.financeiroLancado = true;
      b.financeiroId = finRecord.id;
      await saveBookings();

      state.launchingBookingId = null;
      render();
    });
  }

  const cancelNewFin = document.getElementById('cancel-new-fin');
  if(cancelNewFin){
    cancelNewFin.addEventListener('click', ()=>{
      state.launchingBookingId = null;
      render();
    });
  }

  const saveEditBtn = document.getElementById('save-edit-btn');
  if(saveEditBtn){
    saveEditBtn.addEventListener('click', async ()=>{
      const nomeVal = document.getElementById('edit-nome').value.trim().toUpperCase();
      const telVal = document.getElementById('edit-tel').value.trim();
      const servVal = document.getElementById('edit-servico').value;

      if(!nomeVal){
        alert('O nome não pode ficar vazio.');
        return;
      }

      state.bookings = state.bookings.map(b => {
        if(b.id === state.editingBookingId){
          return {
            ...b,
            nome: nomeVal,
            telefone: telVal,
            servico: servVal
          };
        }
        return b;
      });
      await saveBookings();

      let financialUpdated = false;
      state.financials = state.financials.map(f => {
        if(f.bookingId === state.editingBookingId){
          financialUpdated = true;
          return {
            ...f,
            cliente: nomeVal,
            servico: serviceName(servVal)
          };
        }
        return f;
      });

      if(financialUpdated){
        await saveFinancials();
      }

      state.editingBookingId = null;
      render();
    });
  }

  const cancelEditBtn = document.getElementById('cancel-edit-btn');
  if(cancelEditBtn){
    cancelEditBtn.addEventListener('click', ()=>{
      state.editingBookingId = null;
      render();
    });
  }

  document.querySelectorAll('[data-cancel]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.cancel;
      if(confirm('Deseja realmente excluir este agendamento?')){
        state.bookings = state.bookings.filter(b => b.id !== id);
        await saveBookings();
        render();
      }
    });
  });
}

function renderConfig(app){
  const mKey = state.configMonth || todayStr().slice(0,7);
  const currentSlots = getMonthSlots(mKey);

  app.innerHTML = `
    <div class="app-inner">
      <div class="topbar">
        <button class="gestao-link" id="back-admin">← Voltar ao Painel</button>
      </div>
      <div class="admin-top">
        <h1>Configurar Horários</h1>
      </div>

      <div class="card">
        <label for="config-month-input">Mês de referência</label>
        <input type="month" id="config-month-input" value="${mKey}" style="margin-bottom:12px;">

        <div class="section-label">Horários Padrão para este Mês</div>
        <div style="font-size:0.8rem; color:var(--charcoal); margin-bottom:10px;">
          Adicione ou remova os horários disponíveis que aparecerão para os clientes neste mês.
        </div>

        <div class="slots" id="config-slots-list" style="margin-bottom:14px;">
          ${currentSlots.map(t=>`
            <div class="slot selected" style="display:inline-flex; align-items:center; gap:6px;">
              <span>${t}</span>
              <button type="button" data-rem-slot="${t}" style="background:none; border:none; color:#fff; cursor:pointer; font-weight:bold; padding:0;">×</button>
            </div>
          `).join('')}
        </div>

        <div style="display:flex; gap:8px;">
          <input type="time" id="new-slot-time" style="max-width:140px;">
          <button class="btn btn-small" id="add-slot-btn" style="margin-top:0;">Adicionar Horário</button>
        </div>

        <div style="margin-top:16px; border-top:1px solid var(--line); padding-top:12px; display:flex; justify-content:space-between; align-items:center;">
          <button class="btn btn-outline btn-small" id="reset-default-slots">Restaurar Padrão (9h às 18h)</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('back-admin').addEventListener('click', ()=>{
    state.view = 'admin';
    render();
  });

  document.getElementById('config-month-input').addEventListener('change', (e)=>{
    state.configMonth = e.target.value;
    render();
  });

  document.querySelectorAll('[data-rem-slot]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const t = el.dataset.remSlot;
      const updated = currentSlots.filter(x => x !== t);
      await setMonthSlots(mKey, updated);
      render();
    });
  });

  document.getElementById('add-slot-btn').addEventListener('click', async ()=>{
    const val = document.getElementById('new-slot-time').value;
    if(!val) return;
    const updated = [...currentSlots, val];
    await setMonthSlots(mKey, updated);
    render();
  });

  document.getElementById('reset-default-slots').addEventListener('click', async ()=>{
    if(confirm('Deseja restaurar os horários padrão (de hora em hora e meia em meia das 9h às 18h)?')){
      delete state.horariosPorMes[mKey];
      await saveHorarios();
      render();
    }
  });
}

function renderFinanceiro(app){
  if(!state.finMonth) state.finMonth = todayStr().slice(0,7);
  if(!state.finDate) state.finDate = todayStr();

  const mKey = state.finMonth;
  const dVal = state.finDate;

  const filteredFin = state.financials.filter(f => f.data && f.data.startsWith(mKey));
  const totalMes = filteredFin.reduce((acc, f) => acc + (parseFloat(f.valor) || 0), 0);

  const totalDia = state.financials.filter(f => f.data === dVal).reduce((acc, f) => acc + (parseFloat(f.valor) || 0), 0);
  const qtdMes = filteredFin.length;

  app.innerHTML = `
    <div class="app-inner">
      <div class="topbar">
        <button class="gestao-link" id="back-admin">← Voltar ao Painel</button>
      </div>
      <div class="admin-top">
        <h1>Financeiro</h1>
      </div>

      <div class="card" style="padding:14px;">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px;">
          <div>
            <label for="fin-month-select">Filtrar por Mês</label>
            <input type="month" id="fin-month-select" value="${mKey}">
          </div>
          <div>
            <label for="fin-date-select">Data do Dia</label>
            <input type="date" id="fin-date-select" value="${dVal}">
          </div>
        </div>

        <div class="section-label">Dashboard (${formatMonthName(mKey)})</div>
        <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-top:8px;">
          <div style="background:var(--bone); padding:10px; border-radius:8px; border:1px solid var(--line);">
            <div style="font-size:0.72rem; color:var(--charcoal); text-transform:uppercase;">Total do Dia (${formatDate(dVal)})</div>
            <div style="font-size:1.1rem; font-weight:700; color:var(--ink); margin-top:2px;">R$ ${totalDia.toFixed(2)}</div>
          </div>
          <div style="background:var(--bone); padding:10px; border-radius:8px; border:1px solid var(--line);">
            <div style="font-size:0.72rem; color:var(--charcoal); text-transform:uppercase;">Total do Mês</div>
            <div style="font-size:1.1rem; font-weight:700; color:var(--ink); margin-top:2px;">R$ ${totalMes.toFixed(2)}</div>
          </div>
          <div style="background:var(--bone); padding:10px; border-radius:8px; border:1px solid var(--line); grid-column: span 2;">
            <div style="font-size:0.72rem; color:var(--charcoal); text-transform:uppercase;">Atendimentos (Mês)</div>
            <div style="font-size:1.1rem; font-weight:700; color:var(--ink); margin-top:2px;">${qtdMes}</div>
          </div>
        </div>
      </div>

      <div class="section-label" style="margin-top:16px;">Lançamentos (${formatMonthName(mKey)})</div>
      <div class="day-group" style="margin-top:8px;">
        ${filteredFin.length === 0 ? `
          <div class="empty-state" style="background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px;">
            Nenhum lançamento financeiro neste mês.
          </div>
        ` : filteredFin.map(f => {
          if(state.editingFinId === f.id){
            return `
              <div class="card" style="margin-top:0; margin-bottom:6px; border: 1px solid var(--blush-deep);">
                <strong>Editando lançamento — ${escapeHtml(f.cliente)}</strong>
                <label style="margin-top:6px;">Valor (R$):</label>
                <input type="number" step="0.01" id="edit-fin-valor" value="${f.valor}">
                <label>Forma de Pagamento:</label>
                <select id="edit-fin-forma">
                  <option value="PIX" ${f.formaPagamento==='PIX'?'selected':''}>PIX</option>
                  <option value="Dinheiro" ${f.formaPagamento==='Dinheiro'?'selected':''}>Dinheiro</option>
                  <option value="Cartão Débito" ${f.formaPagamento==='Cartão Débito'?'selected':''}>Cartão Débito</option>
                  <option value="Cartão Crédito" ${f.formaPagamento==='Cartão Crédito'?'selected':''}>Cartão Crédito</option>
                </select>
                <label>Observação:</label>
                <input type="text" id="edit-fin-obs" value="${escapeHtml(f.observacao || '')}">
                <div style="display:flex; gap:6px; margin-top:10px;">
                  <button class="btn btn-small" id="save-edit-fin" style="margin-top:0; flex:1;">Salvar</button>
                  <button class="btn btn-outline btn-small" id="cancel-edit-fin" style="margin-top:0; flex:1;">Cancelar</button>
                </div>
              </div>
            `;
          }

          return `
            <div class="booking-item">
              <div class="booking-main">
                <strong>${formatDate(f.data)} — ${escapeHtml(f.cliente)}</strong>
                <div class="meta">${escapeHtml(f.servico)} · <strong>R$ ${parseFloat(f.valor).toFixed(2)}</strong> (${escapeHtml(f.formaPagamento)})</div>
                ${f.observacao ? `<div class="meta" style="font-style:italic;">Obs: ${escapeHtml(f.observacao)}</div>` : ''}
              </div>
              <div class="booking-actions">
                <button class="icon-btn" data-edit-fin="${f.id}">Editar</button>
                <button class="icon-btn warn" data-del-fin="${f.id}">Excluir</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  document.getElementById('back-admin').addEventListener('click', ()=>{
    state.view = 'admin';
    render();
  });

  document.getElementById('fin-month-select').addEventListener('change', (e)=>{
    state.finMonth = e.target.value;
    render();
  });

  document.getElementById('fin-date-select').addEventListener('change', (e)=>{
    state.finDate = e.target.value;
    render();
  });

  document.querySelectorAll('[data-edit-fin]').forEach(el => {
    el.addEventListener('click', () => {
      state.editingFinId = el.dataset.editFin;
      render();
    });
  });

  const saveEditFinBtn = document.getElementById('save-edit-fin');
  if(saveEditFinBtn){
    saveEditFinBtn.addEventListener('click', async () => {
      const val = parseFloat(document.getElementById('edit-fin-valor').value) || 0;
      const forma = document.getElementById('edit-fin-forma').value;
      const obs = document.getElementById('edit-fin-obs').value.trim();

      state.financials = state.financials.map(f => {
        if(f.id === state.editingFinId){
          return { ...f, valor: val, formaPagamento: forma, observacao: obs };
        }
        return f;
      });
      state.editingFinId = null;
      await saveFinancials();
      render();
    });
  }

  const cancelEditFinBtn = document.getElementById('cancel-edit-fin');
  if(cancelEditFinBtn){
    cancelEditFinBtn.addEventListener('click', () => {
      state.editingFinId = null;
      render();
    });
  }

  document.querySelectorAll('[data-del-fin]').forEach(el => {
    el.addEventListener('click', async () => {
      const id = el.dataset.delFin;
      if(confirm('Deseja realmente excluir este lançamento financeiro?')){
        const finItem = state.financials.find(f => f.id === id);
        if(finItem && finItem.bookingId){
          state.bookings = state.bookings.map(b => {
            if(b.id === finItem.bookingId){
              const { financeiroLancado, financeiroId, ...rest } = b;
              return rest;
            }
            return b;
          });
          await saveBookings();
        }
        state.financials = state.financials.filter(f => f.id !== id);
        await saveFinancials();
        render();
      }
    });
  });
}

loadData().then(()=>{
  render();
});
</script>
</body>
</html>
