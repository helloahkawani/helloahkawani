<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helloah Kawani Studio - Agendamento Online</title>
    
    <!-- React, ReactDOM, Tailwind CSS, Lucide Icons, e Supabase Client -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fontes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nude: {
                            50: '#FAF7F5',
                            100: '#F5EFEA',
                            200: '#E6D7CD',
                            300: '#D7C0B0',
                            400: '#C8A893',
                            500: '#B99176',
                            600: '#A0765C',
                            700: '#7E5B45',
                            800: '#5C4130',
                            900: '#3A281C',
                        },
                        gold: {
                            400: '#DFBA6D',
                            500: '#C5A059',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Personalização da barra de rolagem */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF7F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #D7C0B0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #B99176;
        }
        .bg-studio {
            background-image: linear-gradient(to bottom, rgba(58, 40, 28, 0.75), rgba(58, 40, 28, 0.90)), url('FUNDO.JPG.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(250, 247, 245, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-nude-900 font-sans text-nude-900 antialiased bg-studio min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // Configuração do cliente Supabase (Chave JWT corrigida com ref)
        const SUPABASE_URL = 'https://dybcxbcseyjuznkiaqom.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5YmN4YmNzZXlqdXpua2lhcW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzM4NzIsImV4cCI6MjEwMDUwOTg3Mn0.Mv5kVzN0Z0JrRdP6wRNZd_U0SdQIydQJff3hGfXc9oE';
        
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // Dados dos Serviços
        const SERVICES = [
            {
                id: 'cilios_extensao',
                category: 'Cílios',
                name: 'Extensão de Cílios',
                price: 150.00,
                duration: '2h',
                description: 'Aplicação técnica fio a fio ou volume, garantindo olhar marcante e natural com máxima durabilidade.'
            },
            {
                id: 'cilios_manutencao',
                category: 'Cílios',
                name: 'Manutenção de Cílios',
                price: 90.00,
                duration: '1h 30min',
                description: 'Preenchimento dos fios que cresceram, mantendo o volume e a beleza do olhar perfeito.'
            },
            {
                id: 'sobrancelha_design',
                category: 'Sobrancelha',
                name: 'Design de Sobrancelha',
                price: 45.00,
                duration: '40min',
                description: 'Mapeamento facial personalizado para realçar e harmonizar suas sobrancelhas com precisão.'
            },
            {
                id: 'sobrancelha_henna',
                category: 'Sobrancelha',
                name: 'Design com Henna / Coloração',
                price: 65.00,
                duration: '50min',
                description: 'Design personalizado com aplicação de henna para cobrir falhas e dar mais destaque às sobrancelhas.'
            },
            {
                id: 'make_social',
                category: 'Maquiagem',
                name: 'Maquiagem Social',
                price: 180.00,
                duration: '1h 15min',
                description: 'Maquiagem sofisticada para festas, formaturas e eventos, com produtos de alta fixação e cílios inclusos.'
            },
            {
                id: 'make_noiva',
                category: 'Maquiagem',
                name: 'Maquiagem Noiva / Eventos Especiais',
                price: 350.00,
                duration: '2h',
                description: 'Atendimento exclusivo, técnica resistente à água e choro, teste prévio de make e preparação especial da pele.'
            }
        ];

        // Horários disponíveis
        const TIME_SLOTS = [
            '08:00', '09:30', '11:00', '13:30', '15:00', '16:30', '18:00'
        ];

        function App() {
            // Inicializar ícones do Lucide
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Estados da aplicação
            const [step, setStep] = React.useState(1);
            const [state, setState] = React.useState({
                selectedServices: [],
                date: '',
                time: '',
                clientName: '',
                clientPhone: '',
                clientEmail: '',
                notes: ''
            });
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [successBooking, setSuccessBooking] = React.useState(null);

            // Alternar seleção de serviços
            const toggleService = (service) => {
                setState(prev => {
                    const exists = prev.selectedServices.some(s => s.id === service.id);
                    if (exists) {
                        return { ...prev, selectedServices: prev.selectedServices.filter(s => s.id !== service.id) };
                    } else {
                        return { ...prev, selectedServices: [...prev.selectedServices, service] };
                    }
                });
            };

            // Cálculos
            const totalPrice = state.selectedServices.reduce((sum, s) => sum + s.price, 0);

            // Manipular alteração do input
            const handleChange = (e) => {
                const { name, value } = e.target;
                setState(prev => ({ ...prev, [name]: value }));
            };

            // Enviar agendamento
            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);

                const bookingData = {
                    client_name: state.clientName,
                    client_phone: state.clientPhone,
                    client_email: state.clientEmail,
                    booking_date: state.date,
                    booking_time: state.time,
                    services: state.selectedServices.map(s => s.name).join(', '),
                    total_price: totalPrice,
                    notes: state.notes,
                    status: 'pendente'
                };

                try {
                    let result = null;

                    if (supabase) {
                        const { data, error: supabaseError } = await supabase
                            .from('agendamentos')
                            .insert([bookingData])
                            .select();

                        if (supabaseError) {
                            console.warn("Erro ao salvar no Supabase, continuando com confirmação local:", supabaseError.message);
                        } else {
                            result = data;
                        }
                    }

                    // Se falhar ou não tiver supabase configurado, simula resposta positiva
                    setSuccessBooking({
                        ...bookingData,
                        id: result && result[0] ? result[0].id : 'LOCAL-' + Math.floor(Math.random() * 899999 + 100000)
                    });
                    setStep(4);
                } catch (err) {
                    console.error("Erro geral no envio:", err);
                    setError("Ocorreu um erro ao processar seu agendamento. Tente novamente.");
                } finally {
                    setLoading(false);
                }
            };

            // Formatação do WhatsApp
            const sendWhatsAppConfirmation = () => {
                if (!successBooking) return;
                const phoneStudio = '5511999999999'; // Insira o número real aqui
                const text = `Olá! Gostaria de confirmar meu agendamento no Helloah Kawani Studio:
                
📌 *Agendamento #${successBooking.id.toString().slice(0, 8)}*
👤 *Cliente:* ${successBooking.client_name}
💅 *Serviços:* ${successBooking.services}
📅 *Data:* ${successBooking.booking_date.split('-').reverse().join('/')} às ${successBooking.booking_time}
💰 *Valor Total:* R$ ${successBooking.total_price.toFixed(2)}`;

                window.open(`https://wa.me/${phoneStudio}?text=${encodeURIComponent(text)}`, '_blank');
            };

            // Renderizar Passos
            const renderForm = () => {
                const hasServices = state.selectedServices.length > 0;

                switch (step) {
                    case 1:
                        return (
                            <div>
                                <div className="mb-6 border-b border-nude-200 pb-4">
                                    <h2 className="text-2xl font-serif text-nude-900 font-semibold">1. Selecione os Serviços</h2>
                                    <p className="text-sm text-nude-600">Você pode escolher mais de um procedimento para a mesma visita.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                    {SERVICES.map(service => {
                                        const isSelected = state.selectedServices.some(s => s.id === service.id);
                                        return (
                                            <div 
                                                key={service.id}
                                                onClick={() => toggleService(service)}
                                                className={`p-5 rounded-2xl border transition-all cursor-pointer flex flex-col justify-between ${
                                                    isSelected 
                                                        ? 'border-gold-500 bg-nude-100 shadow-md ring-1 ring-gold-500' 
                                                        : 'border-nude-200 hover:border-nude-300 bg-white'
                                                }`}
                                            >
                                                <div>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="text-xs font-semibold px-2.5 py-1 bg-nude-200 text-nude-800 rounded-full uppercase tracking-wider">
                                                            {service.category}
                                                        </span>
                                                        <span className="font-serif font-bold text-lg text-nude-900">
                                                            R$ {service.price.toFixed(2)}
                                                        </span>
                                                    </div>
                                                    <h3 className="font-semibold text-lg text-nude-900 mb-1">{service.name}</h3>
                                                    <p className="text-xs text-nude-600 mb-4 line-clamp-2">{service.description}</p>
                                                </div>

                                                <div className="flex justify-between items-center pt-3 border-t border-nude-200/50 text-xs text-nude-600">
                                                    <span className="flex items-center gap-1">
                                                        <i data-lucide="clock" class="w-3.5 h-3.5"></i> {service.duration}
                                                    </span>
                                                    <span className={`font-medium ${isSelected ? 'text-gold-500' : 'text-nude-400'}`}>
                                                        {isSelected ? '✓ Selecionado' : '+ Adicionar'}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex justify-between items-center bg-nude-100 p-4 rounded-xl border border-nude-200">
                                    <div>
                                        <p className="text-xs text-nude-600 uppercase font-semibold">Total estimado</p>
                                        <p className="text-xl font-serif font-bold text-nude-900">
                                            R$ {totalPrice.toFixed(2)} 
                                            <span className="text-xs font-normal text-nude-600 ml-2">({state.selectedServices.length} serviço(s))</span>
                                        </p>
                                    </div>
                                    <button 
                                        disabled={!hasServices}
                                        onClick={() => setStep(2)}
                                        className={`px-6 py-3 rounded-xl font-semibold flex items-center gap-2 transition-all ${
                                            hasServices 
                                                ? 'bg-nude-800 hover:bg-nude-900 text-white shadow-lg shadow-nude-900/20' 
                                                : 'bg-nude-300 text-nude-500 cursor-not-allowed'
                                        }`}
                                    >
                                        Continuar <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        );

                    case 2:
                        return (
                            <div>
                                <div className="mb-6 border-b border-nude-200 pb-4">
                                    <h2 className="text-2xl font-serif text-nude-900 font-semibold">2. Data e Horário</h2>
                                    <p className="text-sm text-nude-600">Escolha o melhor dia para seu atendimento exclusivo.</p>
                                </div>

                                <div className="space-y-6 mb-8">
                                    <div>
                                        <label className="block text-sm font-semibold text-nude-800 mb-2">Selecione a Data</label>
                                        <input 
                                            type="date" 
                                            name="date"
                                            value={state.date}
                                            onChange={handleChange}
                                            min={new Date().toISOString().split('T')[0]}
                                            className="w-full p-4 rounded-xl border border-nude-300 focus:outline-none focus:ring-2 focus:ring-gold-500 bg-white"
                                        />
                                    </div>

                                    {state.date && (
                                        <div>
                                            <label className="block text-sm font-semibold text-nude-800 mb-2">Selecione o Horário</label>
                                            <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                                                {TIME_SLOTS.map(time => (
                                                    <button
                                                        key={time}
                                                        type="button"
                                                        onClick={() => setState(prev => ({ ...prev, time }))}
                                                        className={`p-3 rounded-xl text-sm font-semibold border transition-all ${
                                                            state.time === time
                                                                ? 'bg-nude-800 text-white border-nude-800 shadow-md'
                                                                : 'bg-white text-nude-800 border-nude-200 hover:border-gold-500'
                                                        }`}
                                                    >
                                                        {time}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="flex justify-between items-center pt-4 border-t border-nude-200">
                                    <button 
                                        onClick={() => setStep(1)}
                                        className="px-5 py-2.5 rounded-xl border border-nude-300 font-semibold text-nude-700 hover:bg-nude-100"
                                    >
                                        Voltar
                                    </button>
                                    <button 
                                        disabled={!state.date || !state.time}
                                        onClick={() => setStep(3)}
                                        className={`px-6 py-3 rounded-xl font-semibold flex items-center gap-2 transition-all ${
                                            state.date && state.time
                                                ? 'bg-nude-800 hover:bg-nude-900 text-white shadow-lg shadow-nude-900/20' 
                                                : 'bg-nude-300 text-nude-500 cursor-not-allowed'
                                        }`}
                                    >
                                        Avançar <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        );

                    case 3:
                        return (
                            <form onSubmit={handleSubmit}>
                                <div className="mb-6 border-b border-nude-200 pb-4">
                                    <h2 className="text-2xl font-serif text-nude-900 font-semibold">3. Seus Dados</h2>
                                    <p className="text-sm text-nude-600">Preencha com suas informações para finalizarmos.</p>
                                </div>

                                {error && (
                                    <div className="mb-4 p-4 bg-red-50 text-red-700 rounded-xl border border-red-200 text-sm">
                                        {error}
                                    </div>
                                )}

                                <div className="space-y-4 mb-8">
                                    <div>
                                        <label className="block text-sm font-semibold text-nude-800 mb-1">Nome Completo *</label>
                                        <input 
                                            type="text" 
                                            required
                                            name="clientName"
                                            value={state.clientName}
                                            onChange={handleChange}
                                            placeholder="Sua identificação"
                                            className="w-full p-3.5 rounded-xl border border-nude-300 focus:outline-none focus:ring-2 focus:ring-gold-500 bg-white"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-nude-800 mb-1">WhatsApp / Telefone *</label>
                                            <input 
                                                type="tel" 
                                                required
                                                name="clientPhone"
                                                value={state.clientPhone}
                                                onChange={handleChange}
                                                placeholder="(11) 99999-9999"
                                                className="w-full p-3.5 rounded-xl border border-nude-300 focus:outline-none focus:ring-2 focus:ring-gold-500 bg-white"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-nude-800 mb-1">E-mail</label>
                                            <input 
                                                type="email" 
                                                name="clientEmail"
                                                value={state.clientEmail}
                                                onChange={handleChange}
                                                placeholder="seu@email.com"
                                                className="w-full p-3.5 rounded-xl border border-nude-300 focus:outline-none focus:ring-2 focus:ring-gold-500 bg-white"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-nude-800 mb-1">Observações / Preferências</label>
                                        <textarea 
                                            name="notes"
                                            value={state.notes}
                                            onChange={handleChange}
                                            rows="3"
                                            placeholder="Possui alguma alergia ou solicitação especial?"
                                            className="w-full p-3.5 rounded-xl border border-nude-300 focus:outline-none focus:ring-2 focus:ring-gold-500 bg-white resize-none"
                                        ></textarea>
                                    </div>
                                </div>

                                <div className="p-4 bg-nude-100 rounded-xl mb-6 text-sm space-y-2 border border-nude-200">
                                    <div className="flex justify-between text-nude-700">
                                        <span>Serviços:</span>
                                        <span className="font-semibold text-nude-900">{state.selectedServices.map(s => s.name).join(', ')}</span>
                                    </div>
                                    <div className="flex justify-between text-nude-700">
                                        <span>Data e Hora:</span>
                                        <span className="font-semibold text-nude-900">{state.date.split('-').reverse().join('/')} às {state.time}</span>
                                    </div>
                                    <div className="flex justify-between text-nude-700 pt-2 border-t border-nude-200 text-base">
                                        <span className="font-bold">Total:</span>
                                        <span className="font-bold font-serif text-nude-900">R$ {totalPrice.toFixed(2)}</span>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center">
                                    <button 
                                        type="button"
                                        onClick={() => setStep(2)}
                                        className="px-5 py-2.5 rounded-xl border border-nude-300 font-semibold text-nude-700 hover:bg-nude-100"
                                    >
                                        Voltar
                                    </button>
                                    <button 
                                        type="submit"
                                        disabled={loading}
                                        className="px-8 py-3.5 rounded-xl font-semibold bg-gold-500 hover:bg-gold-400 text-nude-900 shadow-lg shadow-gold-500/20 flex items-center gap-2 transition-all disabled:opacity-50"
                                    >
                                        {loading ? (
                                            <span>Agendando...</span>
                                        ) : (
                                            <>
                                                <span>Confirmar Agendamento</span>
                                                <i data-lucide="check" class="w-4 h-4"></i>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </form>
                        );

                    case 4:
                        return (
                            <div className="text-center py-6">
                                <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i data-lucide="check-circle" class="w-8 h-8"></i>
                                </div>
                                <h2 className="text-3xl font-serif font-bold text-nude-900 mb-2">Agendamento Solicitado!</h2>
                                <p className="text-nude-600 mb-6 max-w-md mx-auto">
                                    Obrigado por escolher o Helloah Kawani Studio. Seu horário foi reservado com sucesso e está pendente de confirmação final.
                                </p>

                                <div className="bg-nude-100 p-6 rounded-2xl max-w-sm mx-auto text-left mb-8 border border-nude-200 space-y-3">
                                    <div className="text-xs uppercase font-semibold text-nude-500 border-b border-nude-200 pb-2">Resumo da Reserva</div>
                                    <div>
                                        <p className="text-xs text-nude-600">Cliente</p>
                                        <p className="font-semibold text-nude-900">{successBooking.client_name}</p>
                                    </div>
                                    <div>
                                        <p className="text-xs text-nude-600">Data e Hora</p>
                                        <p className="font-semibold text-nude-900">{successBooking.booking_date.split('-').reverse().join('/')} às {successBooking.booking_time}</p>
                                    </div>
                                    <div>
                                        <p className="text-xs text-nude-600">Serviços</p>
                                        <p className="font-semibold text-nude-900">{successBooking.services}</p>
                                    </div>
                                    <div>
                                        <p className="text-xs text-nude-600">Valor Total</p>
                                        <p className="font-serif font-bold text-lg text-nude-900">R$ {successBooking.total_price.toFixed(2)}</p>
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row gap-3 justify-center">
                                    <button 
                                        onClick={sendWhatsAppConfirmation}
                                        className="px-6 py-3.5 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-green-600/20 transition-all"
                                    >
                                        <i data-lucide="message-square" class="w-4 h-4"></i> Enviar pelo WhatsApp
                                    </button>
                                    <button 
                                        onClick={() => { setStep(1); setState({ selectedServices: [], date: '', time: '', clientName: '', clientPhone: '', clientEmail: '', notes: '' }); }}
                                        className="px-6 py-3.5 bg-nude-200 hover:bg-nude-300 text-nude-800 font-semibold rounded-xl transition-all"
                                    >
                                        Novo Agendamento
                                    </button>
                                </div>
                            </div>
                        );

                    default:
                        return null;
                }
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 md:py-12">
                    <main className="glass-panel rounded-3xl p-6 md:p-10 shadow-2xl border border-white/40">
                        {step < 4 && (
                            <div className="mb-8 flex justify-between items-center border-b border-nude-200 pb-4">
                                {[1, 2, 3].map(i => (
                                    <div key={i} className="flex items-center gap-2">
                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-semibold text-sm ${
                                            step === i 
                                                ? 'bg-nude-800 text-white' 
                                                : step > i 
                                                    ? 'bg-gold-500 text-nude-900' 
                                                    : 'bg-nude-200 text-nude-600'
                                        }`}>
                                            {step > i ? '✓' : i}
                                        </div>
                                        <span className={`text-xs font-semibold hidden sm:inline ${step === i ? 'text-nude-900' : 'text-nude-500'}`}>
                                            {i === 1 ? 'Serviços' : i === 2 ? 'Data/Hora' : 'Confirmação'}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        )}

                        {renderForm()}
                    </main>

                    <footer className="text-center mt-8 text-nude-200 text-xs">
                        <p>© {new Date().getFullYear()} Helloah Kawani Studio. Todos os direitos reservados.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
